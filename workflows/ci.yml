Sinh viên cần hiểu quy trình:

Làm việc cá nhân
      ->
Quản lý phiên bản
      ->
Làm việc nhóm
      ->
Code Review
      ->
Tích hợp mã nguồn
      ->
Kiểm thử tự động
      ->
CI/CD

Mục tiêu của project không phải chỉ nhớ các lệnh Git mà phải hiểu được
